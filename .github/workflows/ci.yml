name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      # ponytail: no --with-deps; the runner image already has what headless Chromium needs, and the
      # extras it adds (fonts, xvfb) download at ~50 kB/s from Ubuntu's mirror. Re-add it for screenshot or headed tests.
      - run: pnpm exec playwright install chromium
      - run: pnpm run test:e2e
