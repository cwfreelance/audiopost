:root{
  --ap-stamp:#d6336c;          /* stamp */
  --ap-mark:#f0f0f0;           /* level-meter bars inside the stamp */
  --ap-light-bg:#f0f0f0;       /* light background */
  --ap-audio-on-light:#000000; /* "AUDIO" on light */
  --ap-post-on-light:#d6336c;  /* "POST" on light */
  --ap-dark-bg:#000000;        /* dark background */
  --ap-audio-on-dark:#f0f0f0;  /* "AUDIO" on dark */
  --ap-post-on-dark:#d6336c;   /* "POST" on dark */
  --ap-tile-bg:#d6336c;        /* app tile background */
  --ap-tile-stamp:#f0f0f0;     /* stamp on the app tile */
  --ap-tile-mark:#d6336c;      /* meter bars on the app tile */
}
html,body{margin:0;background:#ffffff}
body{min-height:100vh;display:grid;place-items:center}
.artboard{width:680px;height:640px;display:flex;flex-direction:column;font-family:system-ui,sans-serif}
.panel{flex:1;display:flex;align-items:center;justify-content:center}
.lockup{display:flex;flex-direction:row;align-items:center;gap:14px}
.wordmark{font-family:'Londrina Solid',sans-serif;font-size:70px;font-weight:400;font-style:normal;line-height:1;letter-spacing:0;white-space:nowrap;text-transform:uppercase}
.icons{height:112px;flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.icons>div{padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center;gap:14px}
.tile{display:grid;place-items:center;background:var(--ap-tile-bg)}
.mark{color:var(--ap-mark);fill:var(--ap-stamp)}
.tile .mark{color:var(--ap-tile-mark);fill:var(--ap-tile-stamp)}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden">
<symbol id="ap-stamp" viewBox="0 0 100 100"><path d="M16.44 7.58L21.51 7.58A2.23 2.23 0 0 1 23.37 8.57A5.51 5.51 0 0 0 32.54 8.57A2.23 2.23 0 0 1 34.4 7.58L43.56 7.58A2.23 2.23 0 0 1 45.41 8.57A5.51 5.51 0 0 0 54.59 8.57A2.23 2.23 0 0 1 56.44 7.58L65.6 7.58A2.23 2.23 0 0 1 67.46 8.57A5.51 5.51 0 0 0 76.63 8.57A2.23 2.23 0 0 1 78.49 7.58L83.56 7.58A2.26 2.26 0 0 1 85.81 9.84L85.81 21.51A2.23 2.23 0 0 1 84.82 23.37A5.51 5.51 0 0 0 84.82 32.54A2.23 2.23 0 0 1 85.81 34.4L85.81 43.56A2.23 2.23 0 0 1 84.82 45.41A5.51 5.51 0 0 0 84.82 54.59A2.23 2.23 0 0 1 85.81 56.44L85.81 65.6A2.23 2.23 0 0 1 84.82 67.46A5.51 5.51 0 0 0 84.82 76.63A2.23 2.23 0 0 1 85.81 78.49L85.81 90.16A2.26 2.26 0 0 1 83.56 92.42L78.49 92.42A2.23 2.23 0 0 1 76.63 91.43A5.51 5.51 0 0 0 67.46 91.43A2.23 2.23 0 0 1 65.6 92.42L56.44 92.42A2.23 2.23 0 0 1 54.59 91.43A5.51 5.51 0 0 0 45.41 91.43A2.23 2.23 0 0 1 43.56 92.42L34.4 92.42A2.23 2.23 0 0 1 32.54 91.43A5.51 5.51 0 0 0 23.37 91.43A2.23 2.23 0 0 1 21.51 92.42L16.44 92.42A2.26 2.26 0 0 1 14.19 90.16L14.19 78.49A2.23 2.23 0 0 1 15.18 76.63A5.51 5.51 0 0 0 15.18 67.46A2.23 2.23 0 0 1 14.19 65.6L14.19 56.44A2.23 2.23 0 0 1 15.18 54.59A5.51 5.51 0 0 0 15.18 45.41A2.23 2.23 0 0 1 14.19 43.56L14.19 34.4A2.23 2.23 0 0 1 15.18 32.54A5.51 5.51 0 0 0 15.18 23.37A2.23 2.23 0 0 1 14.19 21.51L14.19 9.84A2.26 2.26 0 0 1 16.44 7.58Z"></path></symbol>
<symbol id="ap-meter" viewBox="0 0 100 100"><g fill="currentColor"><rect x="26" y="50" width="7" height="18"></rect><rect x="36.25" y="34" width="7" height="34"></rect><rect x="46.5" y="56" width="7" height="12"></rect><rect x="56.75" y="42" width="7" height="26"></rect><rect x="67" y="47" width="7" height="21"></rect></g></symbol>
<!-- "Roughness 5": a turbulence displacement on the stamp + meter (scale 3.5 in the 100-unit box) -->
<filter id="ap-rough" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="noise"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<symbol id="ap-logo" viewBox="0 0 100 100"><g filter="url(#ap-rough)"><use href="#ap-stamp"></use><use href="#ap-meter"></use></g></symbol>
</svg>

<div class="artboard">
  <div class="panel" style="background:var(--ap-light-bg)">
    <div class="lockup">
      <svg class="mark" width="108" height="108" aria-hidden="true" style="flex:none"><use href="#ap-logo"></use></svg>
      <span class="wordmark"><span style="color:var(--ap-audio-on-light)">audio</span><span style="color:var(--ap-post-on-light)">post</span></span>
    </div>
  </div>
  <div class="panel" style="background:var(--ap-dark-bg)">
    <div class="lockup">
      <svg class="mark" width="108" height="108" aria-hidden="true" style="flex:none"><use href="#ap-logo"></use></svg>
      <span class="wordmark"><span style="color:var(--ap-audio-on-dark)">audio</span><span style="color:var(--ap-post-on-dark)">post</span></span>
    </div>
  </div>
  <div class="icons">
    <div style="background:var(--ap-light-bg)">
      <div class="row">
        <svg class="mark" width="64" height="64" role="img" aria-label="audiopost icon, 64 px"><use href="#ap-logo"></use></svg>
        <svg class="mark" width="32" height="32" role="img" aria-label="audiopost icon, 32 px"><use href="#ap-logo"></use></svg>
        <svg class="mark" width="16" height="16" role="img" aria-label="audiopost icon, 16 px"><use href="#ap-logo"></use></svg>
      </div>
      <div class="row">
        <div class="tile" style="width:64px;height:64px;border-radius:6px"><svg class="mark" width="52" height="52" role="img" aria-label="audiopost app icon, 64 px"><use href="#ap-logo"></use></svg></div>
        <div class="tile" style="width:32px;height:32px;border-radius:6px"><svg class="mark" width="26" height="26" role="img" aria-label="audiopost app icon, 32 px"><use href="#ap-logo"></use></svg></div>
        <div class="tile" style="width:16px;height:16px;border-radius:2px"><svg class="mark" width="13" height="13" role="img" aria-label="audiopost app icon, 16 px"><use href="#ap-logo"></use></svg></div>
      </div>
    </div>
    <div style="background:var(--ap-dark-bg);border-top:1px solid color-mix(in srgb, var(--ap-audio-on-dark) 10%, transparent)">
      <div class="row">
        <svg class="mark" width="64" height="64" role="img" aria-label="audiopost icon on dark, 64 px"><use href="#ap-logo"></use></svg>
        <svg class="mark" width="32" height="32" role="img" aria-label="audiopost icon on dark, 32 px"><use href="#ap-logo"></use></svg>
        <svg class="mark" width="16" height="16" role="img" aria-label="audiopost icon on dark, 16 px"><use href="#ap-logo"></use></svg>
      </div>
      <div class="row">
        <div class="tile" style="width:64px;height:64px;border-radius:6px"><svg class="mark" width="52" height="52" role="img" aria-label="audiopost app icon on dark, 64 px"><use href="#ap-logo"></use></svg></div>
        <div class="tile" style="width:32px;height:32px;border-radius:6px"><svg class="mark" width="26" height="26" role="img" aria-label="audiopost app icon on dark, 32 px"><use href="#ap-logo"></use></svg></div>
        <div class="tile" style="width:16px;height:16px;border-radius:2px"><svg class="mark" width="13" height="13" role="img" aria-label="audiopost app icon on dark, 16 px"><use href="#ap-logo"></use></svg></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
